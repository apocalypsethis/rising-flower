<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>花花变身涂色</title>
    <style>
      :root {
        --sky-top: #aee3ff;
        --sky-bottom: #e8f9ff;
        --grass: #7ec850;
        --grass-dark: #5da83c;
        --panel: rgba(255, 255, 255, 0.92);
        --ink: #23405e;
        --btn-shadow: 0 4px 0 rgba(35, 64, 94, 0.18);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --sky-top: #1d2f5e;
          --sky-bottom: #3a4a8a;
          --grass: #2e6b34;
          --grass-dark: #265a2c;
          --panel: rgba(24, 32, 58, 0.92);
          --ink: #eaf2ff;
          --btn-shadow: 0 4px 0 rgba(0, 0, 0, 0.35);
        }
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
        color: var(--ink);
        overflow: hidden;
      }
      button { min-height: 2.75rem; min-width: 2.75rem; }

      #stage {
        position: relative;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 78%, var(--grass) 78.2%, var(--grass) 100%);
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        overflow: hidden;
      }
      /* 白天/夜晚装饰 */
      .sun {
        position: absolute; top: 4.5rem; right: 6%;
        width: 64px; height: 64px; border-radius: 50%;
        background: radial-gradient(circle at 40% 40%, #fff3b0, #ffd93b 70%);
        box-shadow: 0 0 32px 10px rgba(255, 217, 59, 0.45);
        pointer-events: none;
      }
      @media (prefers-color-scheme: dark) {
        .sun {
          background: radial-gradient(circle at 35% 35%, #fdfdf5, #dfe6f2 70%);
          box-shadow: 0 0 24px 6px rgba(230, 238, 255, 0.35);
        }
      }
      .cloud {
        position: absolute; pointer-events: none; opacity: 0.9;
        animation: drift 26s linear infinite;
      }
      .cloud svg { display: block; }
      @media (prefers-color-scheme: dark) { .cloud { opacity: 0.25; } }
      @keyframes drift {
        from { transform: translateX(-14vw); }
        to   { transform: translateX(104vw); }
      }

      /* 顶部小按钮 */
      .topbar {
        position: absolute; top: calc(env(safe-area-inset-top, 0px) + 10px);
        left: 10px; right: 10px;
        display: flex; justify-content: space-between; align-items: flex-start;
        z-index: 30; pointer-events: none;
      }
      .topbar .group { display: flex; gap: 8px; pointer-events: auto; }
      .icon-btn {
        border: none; border-radius: 999px;
        background: var(--panel); color: var(--ink);
        font-size: 1.05rem; font-weight: 700;
        padding: 0 16px; height: 44px;
        box-shadow: var(--btn-shadow);
        cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
      }
      .icon-btn:active { transform: translateY(2px); box-shadow: none; }
      .icon-btn.round { width: 44px; padding: 0; justify-content: center; font-size: 1.25rem; }

      /* 花朵舞台 */
      #scene {
        position: relative; flex: 1 1 auto; min-height: 0;
      }
      #flower-wrap {
        position: absolute; left: 50%; bottom: 9%;
        transform: translateX(-50%);
        height: min(88%, 620px);
        aspect-ratio: 400 / 560;
        max-width: 94vw;
      }
      #flower {
        width: 100%; height: 100%; display: block; overflow: visible;
        animation: sway 5s ease-in-out infinite;
        transform-origin: 50% 96%;
      }
      @keyframes sway {
        0%, 100% { transform: rotate(-1.4deg); }
        50% { transform: rotate(1.4deg); }
      }
      .part { cursor: pointer; transform-box: fill-box; transform-origin: center; }
      .part.pop { animation: pop 0.38s ease-out; }
      @keyframes pop {
        0% { transform: scale(1); }
        40% { transform: scale(1.22) rotate(-3deg); }
        100% { transform: scale(1); }
      }

      /* 印章 */
      .stamp {
        position: absolute; z-index: 12; pointer-events: auto; cursor: pointer;
        animation: stamp-in 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        filter: drop-shadow(0 3px 3px rgba(35, 64, 94, 0.25));
      }
      .stamp svg { display: block; width: 100%; height: 100%; overflow: visible; }
      .stamp .bob { animation: bob 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes bob {
        0%, 100% { transform: translateY(0) rotate(-3deg); }
        50% { transform: translateY(-6px) rotate(3deg); }
      }
      @keyframes stamp-in {
        0% { transform: scale(0) rotate(-30deg); opacity: 0; }
        100% { transform: scale(1) rotate(var(--rot, 0deg)); opacity: 1; }
      }
      .stamp.bye { transition: transform 0.25s ease-in, opacity 0.25s ease-in; transform: scale(0) rotate(40deg) !important; opacity: 0; }
      .stamp .wing-l, .stamp .wing-r { transform-box: fill-box; }
      .stamp .wing-l { transform-origin: 100% 60%; animation: flap 0.5s ease-in-out infinite alternate; }
      .stamp .wing-r { transform-origin: 0% 60%; animation: flap 0.5s ease-in-out infinite alternate-reverse; }
      @keyframes flap {
        from { transform: scaleX(1); }
        to { transform: scaleX(0.55); }
      }

      /* 闪光 & 夸奖 */
      .sparkle {
        position: absolute; z-index: 20; pointer-events: none;
        font-size: 22px; line-height: 1;
      }
      .praise {
        position: absolute; z-index: 21; pointer-events: none;
        left: 50%; top: 16%;
        transform: translateX(-50%);
        background: var(--panel); color: var(--ink);
        font-size: clamp(1.3rem, 5.5vw, 1.8rem); font-weight: 800;
        padding: 10px 22px; border-radius: 999px;
        box-shadow: var(--btn-shadow); white-space: nowrap;
      }

      /* 底部色盘 */
      #palette-bar {
        position: relative; z-index: 30;
        display: flex; align-items: center; justify-content: center; gap: 10px;
        padding: 10px 12px calc(env(safe-area-inset-bottom, 0px) + 12px);
        flex-wrap: wrap;
      }
      #palette {
        display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
        background: var(--panel); border-radius: 999px; padding: 8px 12px;
        box-shadow: var(--btn-shadow);
        max-width: 100%;
      }
      .swatch {
        width: 46px; height: 46px; border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.9);
        box-shadow: 0 2px 6px rgba(35, 64, 94, 0.3);
        cursor: pointer; padding: 0; min-width: 46px; min-height: 46px;
        transition: transform 0.15s ease;
      }
      .swatch.selected { transform: scale(1.28); border-color: #fff; box-shadow: 0 0 0 3px var(--ink), 0 4px 10px rgba(35, 64, 94, 0.35); }
      .swatch.rainbow {
        background: conic-gradient(#ef4444, #f97316, #facc15, #22c55e, #3b82f6, #a855f7, #ec4899, #ef4444);
        font-size: 1.15rem; display: inline-flex; align-items: center; justify-content: center;
      }
      #wand {
        border: none; border-radius: 999px; cursor: pointer;
        height: 62px; padding: 0 22px;
        font-size: 1.9rem;
        background: linear-gradient(135deg, #ffb020, #ff7847);
        box-shadow: 0 5px 0 rgba(160, 74, 0, 0.45);
      }
      #wand:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(160, 74, 0, 0.45); }
      #clear-stamps {
        border: none; border-radius: 50%; cursor: pointer;
        width: 48px; height: 48px; font-size: 1.3rem;
        background: var(--panel); box-shadow: var(--btn-shadow);
      }
      #clear-stamps:active { transform: translateY(2px); box-shadow: none; }

      /* 原画弹层 */
      #overlay {
        position: fixed; inset: 0; z-index: 50;
        background: rgba(10, 20, 40, 0.72);
        display: none; align-items: center; justify-content: center;
        padding: 18px;
      }
      #overlay.open { display: flex; }
      #overlay figure {
        margin: 0; background: #fff; border-radius: 18px; padding: 12px;
        max-width: min(92vw, 430px); box-shadow: 0 18px 50px rgba(0,0,0,0.4);
      }
      #overlay img { display: block; width: 100%; height: auto; border-radius: 10px; }
      #overlay figcaption {
        text-align: center; font-weight: 700; color: #23405e;
        padding: 10px 4px 2px; font-size: 1rem;
      }
      #overlay .close {
        position: absolute; top: calc(env(safe-area-inset-top, 0px) + 14px); right: 14px;
        width: 48px; height: 48px; border-radius: 50%; border: none;
        background: #fff; color: #23405e; font-size: 1.4rem; cursor: pointer;
        box-shadow: 0 4px 14px rgba(0,0,0,0.35);
      }

      @media (prefers-reduced-motion: reduce) {
        #flower, .cloud, .stamp .bob, .stamp .wing-l, .stamp .wing-r { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <main id="stage">
      <div class="sun" aria-hidden="true"></div>
      <div class="cloud" style="top: 9%; animation-duration: 34s;" aria-hidden="true">
        <svg width="110" height="44" viewBox="0 0 110 44"><g fill="#ffffff"><ellipse cx="34" cy="30" rx="26" ry="13"/><ellipse cx="62" cy="22" rx="24" ry="17"/><ellipse cx="84" cy="31" rx="20" ry="11"/></g></svg>
      </div>

      </div>

      <div id="palette-bar">
        <div id="palette" role="group" aria-label="颜色盘"></div>

        <button id="clear-stamps" type="button" aria-label="收走所有印章">🧹</button>
      </div>
    </main>

    <script>
      (function () {
        "use strict";

        var COLORS = [
          { name: "红色", value: "#ef4444" },
          { name: "橙色", value: "#f97316" },
          { name: "黄色", value: "#facc15" },
          { name: "绿色", value: "#22c55e" },
          { name: "蓝色", value: "#3b82f6" },
          { name: "紫色", value: "#a855f7" },
          { name: "粉色", value: "#ec4899" },
          { name: "白色", value: "#ffffff" }
        ];
        var ORIGINALS = {
          petal: "#5b9bd5", heart: "#d42a20", stem: "#4a90d9",
          leafL: "#2fb84d", leafR: "#2fb84d", pot: "#2b2b2b"
        };
        var PRAISES = ["哇！", "好漂亮！", "变身啦！", "太棒了！", "好好看！", "闪闪亮！"];

        var scene = document.getElementById("scene");
        var stage = document.getElementById("stage");
        var paletteEl = document.getElementById("palette");
        var currentColor = "rainbow";
        var tapCount = 0;

        /* ---------- 声音（WebAudio 合成，无音频文件） ---------- */
        var audioCtx = null, soundOn = true;
        function ac() {
          if (!audioCtx) {
            var AC = window.AudioContext || window.webkitAudioContext;
            if (AC) audioCtx = new AC();
          }
          if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
          return audioCtx;
        }
        function tone(freq, dur, type, vol, when) {
          if (!soundOn) return;
          var ctx = ac(); if (!ctx) return;
          var t = ctx.currentTime + (when || 0);
          var o = ctx.createOscillator(), g = ctx.createGain();
          o.type = type || "sine"; o.frequency.setValueAtTime(freq, t);
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(vol || 0.18, t + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
          o.connect(g); g.connect(ctx.destination);
          o.start(t); o.stop(t + dur + 0.05);
        }
        function popSound() {
          var base = 380 + Math.random() * 320;
          tone(base, 0.16, "sine", 0.22);
          tone(base * 1.5, 0.12, "triangle", 0.12, 0.03);
        }
        function stampSound() { tone(880, 0.14, "sine", 0.16); tone(1318, 0.2, "sine", 0.14, 0.07); }
        function wandSound() {
          var notes = [523, 659, 784, 1046, 1318];
          for (var i = 0; i < notes.length; i++) tone(notes[i], 0.22, "triangle", 0.16, i * 0.07);
        }

        /* ---------- 色盘 ---------- */
        function pickColor() {
          if (currentColor === "rainbow") {
            return COLORS[Math.floor(Math.random() * COLORS.length)].value;
          }
          return currentColor;
        }
        var rainbowBtn = document.createElement("button");
        rainbowBtn.type = "button";
        rainbowBtn.className = "swatch rainbow selected";
        rainbowBtn.setAttribute("aria-label", "彩虹色：每次点都不一样");
        rainbowBtn.textContent = "🌈";
        rainbowBtn.addEventListener("click", function () { selectSwatch(rainbowBtn, "rainbow"); });
        paletteEl.appendChild(rainbowBtn);
        COLORS.forEach(function (c) {
          var b = document.createElement("button");
          b.type = "button";
          b.className = "swatch";
          b.style.background = c.value;
          b.setAttribute("aria-label", c.name);
          b.addEventListener("click", function () { selectSwatch(b, c.value); tone(660, 0.1, "sine", 0.12); });
          paletteEl.appendChild(b);
        });
        function selectSwatch(btn, value) {
          currentColor = value;
          var all = paletteEl.querySelectorAll(".swatch");
          for (var i = 0; i < all.length; i++) all[i].classList.remove("selected");
          btn.classList.add("selected");
        }

        /* ---------- 涂色 ---------- */
        function applyColor(part, color) {
          var mode = part.getAttribute("data-mode");
          if (mode === "fill") {
            var p = part.querySelector("path");
            if (p) p.setAttribute("fill", color);
          } else {
            var paths = part.querySelectorAll("path");
            for (var i = 0; i < paths.length; i++) paths[i].setAttribute("stroke", color);
          }
          part.classList.remove("pop");
          void part.getBoundingClientRect;
          part.classList.add("pop");
        }
        function sparkleBurst(x, y, n) {
          var glyphs = ["✨", "⭐", "💛", "🌟"];
          for (var i = 0; i < (n || 5); i++) {
            var s = document.createElement("span");
            s.className = "sparkle";
            s.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
            s.style.left = x + "px"; s.style.top = y + "px";
            stage.appendChild(s);
            var dx = (Math.random() - 0.5) * 130;
            var dy = -40 - Math.random() * 90;
            var anim = s.animate([
              { transform: "translate(-50%,-50%) scale(0.4)", opacity: 1 },
              { transform: "translate(calc(-50% + " + dx + "px), calc(-50% + " + dy + "px)) scale(1.15) rotate(" + (Math.random() * 90 - 45) + "deg)", opacity: 0 }
            ], { duration: 650 + Math.random() * 300, easing: "ease-out" });
            anim.onfinish = (function (el) { return function () { el.remove(); }; })(s);
          }
        }
        function praise() {
          var old = stage.querySelector(".praise");
          if (old) old.remove();
          var el = document.createElement("div");
          el.className = "praise";
          el.textContent = PRAISES[Math.floor(Math.random() * PRAISES.length)];
          stage.appendChild(el);
          var anim = el.animate([
            { transform: "translateX(-50%) scale(0.5)", opacity: 0 },
            { transform: "translateX(-50%) scale(1.08)", opacity: 1, offset: 0.25 },
            { transform: "translateX(-50%) scale(1)", opacity: 1, offset: 0.8 },
            { transform: "translateX(-50%) translateY(-14px) scale(1)", opacity: 0 }
          ], { duration: 1200, easing: "ease-out" });
          anim.onfinish = function () { el.remove(); };
        }
        function colorPart(part, clientX, clientY) {
          applyColor(part, pickColor());
          popSound();
          var r = stage.getBoundingClientRect();
          sparkleBurst(clientX - r.left, clientY - r.top, 5);
          tapCount++;
          if (tapCount % 6 === 0) praise();
        }
        var parts = document.querySelectorAll(".part");
        parts.forEach(function (part) {
          part.addEventListener("pointerdown", function (e) {
            e.stopPropagation();
            colorPart(part, e.clientX, e.clientY);
          });
        });

        /* ---------- 印章 ---------- */
        function butterflySVG(c1, c2) {
          return '<svg viewBox="0 0 100 100"><g class="bob">' +
            '<path class="wing-l" d="M48,46 C26,18 4,26 8,46 C11,62 32,62 48,54 Z" fill="' + c1 + '"/>' +
            '<path class="wing-l" d="M48,56 C30,56 16,66 22,78 C27,88 44,82 48,66 Z" fill="' + c2 + '"/>' +
            '<path class="wing-r" d="M52,46 C74,18 96,26 92,46 C89,62 68,62 52,54 Z" fill="' + c1 + '"/>' +
            '<path class="wing-r" d="M52,56 C70,56 84,66 78,78 C73,88 56,82 52,66 Z" fill="' + c2 + '"/>' +
            '<ellipse cx="50" cy="56" rx="5" ry="17" fill="#4a3728"/>' +
            '<path d="M46,40 C42,30 36,26 32,24 M54,40 C58,30 64,26 68,24" stroke="#4a3728" stroke-width="3" fill="none" stroke-linecap="round"/>' +
            '<circle cx="50" cy="38" r="6" fill="#4a3728"/></g></svg>';
        }
        function beeSVG() {
          return '<svg viewBox="0 0 100 100"><g class="bob">' +
            '<ellipse cx="50" cy="40" rx="15" ry="10" fill="#dff3ff" opacity="0.95"/>' +
            '<ellipse cx="50" cy="60" rx="24" ry="18" fill="#ffcf3f"/>' +
            '<path d="M40,45 v30 M52,42 v36 M64,47 v24" stroke="#4a3728" stroke-width="6" stroke-linecap="round"/>' +
            '<circle cx="72" cy="56" r="3.4" fill="#4a3728"/>' +
            '<path d="M26,60 l-9,4 9,4 Z" fill="#4a3728"/></g></svg>';
        }
        function starSVG(c) {
          return '<svg viewBox="0 0 100 100"><g class="bob"><path d="M50,6 L62,37 L95,38 L69,59 L78,92 L50,72 L22,92 L31,59 L5,38 L38,37 Z" fill="' + c + '" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/></g></svg>';
        }
        function heartSVG(c) {
          return '<svg viewBox="0 0 100 100"><g class="bob"><path d="M50,86 C20,62 8,44 8,29 C8,14 19,5 32,5 C42,5 48,11 50,18 C52,11 58,5 68,5 C81,5 92,14 92,29 C92,44 80,62 50,86 Z" fill="' + c + '" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/></g></svg>';
        }
        function miniFlowerSVG(c1, c2) {
          var petals = "";
          for (var i = 0; i < 5; i++) {
            petals += '<circle cx="50" cy="26" r="14" fill="' + c1 + '" transform="rotate(' + (i * 72) + ' 50 50)"/>';
          }
          return '<svg viewBox="0 0 100 100"><g class="bob">' + petals +
            '<circle cx="50" cy="50" r="12" fill="' + c2 + '"/></g></svg>';
        }
        function randomStampSVG() {
          var cs = COLORS.map(function (c) { return c.value; });
          var a = cs[Math.floor(Math.random() * cs.length)];
          var b = cs[Math.floor(Math.random() * cs.length)];
          var kinds = [butterflySVG, beeSVG, starSVG, heartSVG, miniFlowerSVG];
          var k = kinds[Math.floor(Math.random() * kinds.length)];
          if (k === beeSVG) return k();
          if (k === butterflySVG || k === miniFlowerSVG) return k(a, b);
          return k(a);
        }
        var MAX_STAMPS = 26;
        function addStamp(clientX, clientY) {
          var r = scene.getBoundingClientRect();
          var x = clientX - r.left, y = clientY - r.top;
          var size = 46 + Math.random() * 26;
          var el = document.createElement("div");
          el.className = "stamp";
          el.style.width = size + "px"; el.style.height = size + "px";
          el.style.left = (x - size / 2) + "px"; el.style.top = (y - size / 2) + "px";
          el.style.setProperty("--rot", (Math.random() * 24 - 12) + "deg");
          el.innerHTML = randomStampSVG();
          el.addEventListener("pointerdown", function (e) {
            e.stopPropagation();
            stampSound();
            el.classList.add("bye");
            setTimeout(function () { el.remove(); }, 260);
          });
          scene.appendChild(el);
          var stamps = scene.querySelectorAll(".stamp");
          if (stamps.length > MAX_STAMPS) stamps[0].remove();
          stampSound();
        }
        scene.addEventListener("pointerdown", function (e) {
          if (e.target.closest(".part") || e.target.closest(".stamp")) return;
          addStamp(e.clientX, e.clientY);
        });

        /* ---------- 魔法棒：一键变身 ---------- */
        document.getElementById("wand").addEventListener("click", function () {
          wandSound();
          var list = Array.prototype.slice.call(document.querySelectorAll(".part"));
          list.forEach(function (part, i) {
            setTimeout(function () { applyColor(part, pickColor()); }, i * 70);
          });
          var r = stage.getBoundingClientRect();
          sparkleBurst(r.width / 2, r.height * 0.35, 14);
          setTimeout(praise, list.length * 70 + 60);
        });

        /* ---------- 收走印章 / 复原 / 声音 / 原画 ---------- */
        document.getElementById("clear-stamps").addEventListener("click", function () {
          var stamps = scene.querySelectorAll(".stamp");
          stamps.forEach(function (s, i) {
            setTimeout(function () {
              s.classList.add("bye");
              setTimeout(function () { s.remove(); }, 260);
            }, i * 40);
          });
          if (stamps.length) tone(520, 0.15, "sine", 0.14);
        });
        document.getElementById("btn-reset").addEventListener("click", function () {
          document.querySelectorAll(".part").forEach(function (part) {
            applyColor(part, ORIGINALS[part.getAttribute("data-part")]);
          });
          var stamps = scene.querySelectorAll(".stamp");
          stamps.forEach(function (s) { s.remove(); });
          wandSound();
        });
        var soundBtn = document.getElementById("btn-sound");
        soundBtn.addEventListener("click", function () {
          soundOn = !soundOn;
          soundBtn.textContent = soundOn ? "🔊" : "🔇";
          if (soundOn) stampSound();
        });
        var overlay = document.getElementById("overlay");
        document.getElementById("btn-original").addEventListener("click", function () { overlay.classList.add("open"); });
        document.getElementById("overlay-close").addEventListener("click", function () { overlay.classList.remove("open"); });
        overlay.addEventListener("click", function (e) { if (e.target === overlay) overlay.classList.remove("open"); });

        /* 阻止双击缩放/滚动抢手势 */
        document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
        document.addEventListener("dblclick", function (e) { e.preventDefault(); }, { passive: false });
      })();
    </script>
  </body>
</html>
