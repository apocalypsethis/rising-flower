<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Rising 的小花</title>
    <style>
      :root{
        --page-bg:#bfe6f7;
        --bar-bg:rgba(255,255,255,.82);
        --bar-text:#23404f;
        --bubble-bg:#ffffff;
        --bubble-text:#23404f;
        --shadow:0 6px 18px rgba(31,78,104,.22);
      }
      @media (prefers-color-scheme: dark){
        :root{
          --page-bg:#17384d;
          --bar-bg:rgba(16,42,58,.88);
          --bar-text:#eaf6fc;
          --bubble-bg:#10303f;
          --bubble-text:#eaf6fc;
          --shadow:0 6px 18px rgba(0,0,0,.45);
        }
      }
      *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
      html,body{ height:100%; }
      body{
        margin:0;
        font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
        background:var(--page-bg);
        overflow:hidden;
        user-select:none;
        -webkit-user-select:none;
        touch-action:manipulation;
      }
      #stage{
        position:fixed; inset:0;
        display:flex; flex-direction:column;
      }
      /* ---------- scene ---------- */
      #sceneWrap{
        position:relative; flex:1 1 auto; min-height:0;
      }
      #scene{
        position:absolute; inset:0; width:100%; height:100%;
        display:block;
      }
      /* praise bubble */
      #bubble{
        position:absolute; left:50%; top:12px;
        transform:translate(-50%,-8px) scale(.9);
        background:var(--bubble-bg); color:var(--bubble-text);
        font-size:clamp(18px,4.6vw,26px); font-weight:700;
        padding:10px 22px; border-radius:999px;
        box-shadow:var(--shadow);
        opacity:0; pointer-events:none;
        transition:opacity .25s ease, transform .25s ease;
        white-space:nowrap; z-index:5;
      }
      #bubble.show{ opacity:1; transform:translate(-50%,0) scale(1); }
      #bubble::after{
        content:""; position:absolute; left:50%; bottom:-9px;
        transform:translateX(-50%);
        border:10px solid transparent; border-top-color:var(--bubble-bg); border-bottom:0;
      }
      /* growth stars */
      #stars{
        position:absolute; left:50%; bottom:10px; transform:translateX(-50%);
        display:flex; gap:6px; z-index:4; pointer-events:none;
      }
      #stars svg{ width:30px; height:30px; filter:drop-shadow(0 2px 3px rgba(0,0,0,.18)); }
      #stars .star path{ fill:#d7dee2; transition:fill .4s ease; }
      #stars .star.on path{ fill:#ffb52e; }
      /* parent corner buttons */
      .corner{
        position:absolute; top:10px; z-index:6;
        display:flex; gap:8px;
      }
      #cornerLeft{ left:10px; }
      #cornerRight{ right:10px; }
      .pbtn{
        min-width:48px; height:48px; padding:0 14px;
        border:0; border-radius:999px;
        background:var(--bar-bg); color:var(--bar-text);
        font-size:16px; font-weight:700;
        box-shadow:var(--shadow); cursor:pointer;
        display:inline-flex; align-items:center; justify-content:center; gap:6px;
      }
      .pbtn:active{ transform:scale(.94); }
      .pbtn svg{ width:24px; height:24px; display:block; }
      /* original drawing card */
      #origCard{
        position:absolute; left:10px; top:68px; z-index:7;
        width:min(46vw,210px);
        background:var(--bubble-bg); border-radius:18px;
        box-shadow:var(--shadow); padding:8px;
        transform-origin:top left;
        transition:opacity .25s ease, transform .25s ease;
      }
      #origCard img{ width:100%; display:block; border-radius:12px; }
      #origCard p{
        margin:6px 2px 2px; font-size:13px; color:var(--bubble-text);
        text-align:center; font-weight:600;
      }
      #origCard.hidden{ opacity:0; transform:scale(.85); pointer-events:none; }
      /* ---------- control bar ---------- */
      #bar{
        flex:0 0 auto;
        display:flex; align-items:flex-end; justify-content:center;
        gap:clamp(28px,10vw,72px);
        padding:10px 16px calc(14px + env(safe-area-inset-bottom));
        background:var(--bar-bg);
        backdrop-filter:blur(6px);
        position:relative; z-index:8;
      }
      .bigbtn{
        border:0; background:transparent; cursor:pointer;
        display:flex; flex-direction:column; align-items:center; gap:2px;
        padding:4px; color:var(--bar-text);
        font-family:inherit;
      }
      .bigbtn .disc{
        width:clamp(84px,22vw,108px); height:clamp(84px,22vw,108px);
        border-radius:50%;
        display:flex; align-items:center; justify-content:center;
        box-shadow:var(--shadow), inset 0 -6px 0 rgba(0,0,0,.08);
        transition:transform .12s ease;
      }
      .bigbtn:active .disc{ transform:scale(.9); }
      .bigbtn .disc svg{ width:62%; height:62%; display:block; }
      #btnWater .disc{ background:#4da3e8; }
      #btnSun .disc{ background:#ffb52e; }
      .bigbtn .lbl{ font-size:19px; font-weight:800; letter-spacing:.06em; }
      /* again button */
      #btnAgain{
        border:0; cursor:pointer; flex:0 0 auto;
        background:#43b04c; color:#fff;
        font-family:inherit; font-size:19px; font-weight:800;
        padding:14px 0; border-radius:999px;
        box-shadow:var(--shadow);
        transform:scale(0);
        width:0; opacity:0; overflow:hidden;
        transition:transform .3s cubic-bezier(.34,1.56,.64,1), opacity .2s ease;
        white-space:nowrap;
        align-self:center;
      }
      #btnAgain.show{ transform:scale(1); width:auto; padding:14px 20px; opacity:1; }
      /* ---------- svg animations ---------- */
      .cloud{ animation:drift linear infinite; }
      @keyframes drift{ from{ transform:translateX(-30px);} to{ transform:translateX(30px);} }
      #sunRays{ transform-box:fill-box; transform-origin:center; animation:spin 40s linear infinite; }
      @keyframes spin{ to{ transform:rotate(360deg);} }
      .wingL,.wingR{ transform-box:fill-box; }
      .wingL{ transform-origin:right center; animation:flap .28s ease-in-out infinite alternate; }
      .wingR{ transform-origin:left center; animation:flap .28s ease-in-out infinite alternate-reverse; }
      @keyframes flap{ from{ transform:scaleX(.35);} to{ transform:scaleX(1);} }
      .beeWing{ transform-box:fill-box; transform-origin:bottom center; animation:flap .16s ease-in-out infinite alternate; }
      @media (max-width:600px){
        #bar{ gap:16px; padding-left:10px; padding-right:10px; }
        #bubble{
          top:66px; font-size:19px;
          max-width:92vw; white-space:normal; text-align:center;
          line-height:1.3;
        }
        #origCard{ top:126px; }
      }
      @media (prefers-reduced-motion: reduce){
        .cloud,#sunRays,.wingL,.wingR,.beeWing{ animation:none !important; }
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="sceneWrap">
        <svg id="scene" viewBox="0 -150 400 670" preserveAspectRatio="xMidYMax meet" aria-label="花园">
          <defs>
            <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#8fd4f7"/>
              <stop offset=".72" stop-color="#cdeffb"/>
              <stop offset="1" stop-color="#e8f9e3"/>
            </linearGradient>
            <radialGradient id="sunCore" cx=".5" cy=".5" r=".5">
              <stop offset="0" stop-color="#ffe27a"/>
              <stop offset="1" stop-color="#ffb52e"/>
            </radialGradient>
          </defs>

          <rect x="0" y="-150" width="400" height="670" fill="url(#sky)"/>

          <!-- sun (tappable) -->
          <g id="sunTap" style="cursor:pointer">
            <circle cx="338" cy="62" r="46" fill="transparent"/>
            <g id="sunRays" stroke="#ffb52e" stroke-width="6" stroke-linecap="round">
              <line x1="338" y1="8"  x2="338" y2="22"/>
              <line x1="338" y1="102" x2="338" y2="116"/>
              <line x1="284" y1="62" x2="298" y2="62"/>
              <line x1="378" y1="62" x2="392" y2="62"/>
              <line x1="300" y1="24" x2="310" y2="34"/>
              <line x1="366" y1="90" x2="376" y2="100"/>
              <line x1="376" y1="24" x2="366" y2="34"/>
              <line x1="310" y1="90" x2="300" y2="100"/>
            </g>
            <circle id="sunBody" cx="338" cy="62" r="27" fill="url(#sunCore)"/>
            <circle cx="329" cy="58" r="3.4" fill="#8a5a00"/>
            <circle cx="347" cy="58" r="3.4" fill="#8a5a00"/>
            <path d="M330 68 Q338 75 346 68" stroke="#8a5a00" stroke-width="3" fill="none" stroke-linecap="round"/>
          </g>

          <!-- clouds -->
          <g class="cloud" style="animation-duration:11s" fill="#ffffff" opacity=".92">
            <ellipse cx="70" cy="66" rx="34" ry="17"/>
            <ellipse cx="94" cy="56" rx="24" ry="14"/>
            <ellipse cx="48" cy="57" rx="20" ry="12"/>
          </g>
          <g class="cloud" style="animation-duration:15s; animation-delay:-6s" fill="#ffffff" opacity=".8">
            <ellipse cx="215" cy="40" rx="26" ry="13"/>
            <ellipse cx="234" cy="33" rx="18" ry="11"/>
          </g>

          <!-- ground -->
          <path d="M0 452 Q100 428 200 446 Q300 462 400 440 L400 520 L0 520 Z" fill="#7cc24f"/>
          <path d="M0 478 Q120 460 240 474 Q330 484 400 470 L400 520 L0 520 Z" fill="#63ac3e"/>
          <g stroke="#4c9433" stroke-width="3" stroke-linecap="round" fill="none">
            <path d="M36 486 q-3 -12 -8 -16"/>
            <path d="M44 487 q1 -13 6 -18"/>
            <path d="M356 492 q-3 -12 -8 -16"/>
            <path d="M364 493 q1 -13 6 -18"/>
            <path d="M96 500 q-2 -10 -7 -14"/>
            <path d="M308 502 q2 -10 7 -14"/>
          </g>
          <!-- little ground flowers -->
          <g>
            <circle cx="52" cy="470" r="5" fill="#ff8fb2"/><circle cx="52" cy="470" r="2" fill="#fff"/>
            <circle cx="348" cy="462" r="5" fill="#c39bff"/><circle cx="348" cy="462" r="2" fill="#fff"/>
            <circle cx="112" cy="486" r="4.5" fill="#ffd93b"/><circle cx="112" cy="486" r="1.8" fill="#fff"/>
            <circle cx="292" cy="488" r="4.5" fill="#ff8fb2"/><circle cx="292" cy="488" r="1.8" fill="#fff"/>
          </g>

          <!-- watering can prop, tilts when watering -->
          <g id="canProp" opacity="0">
            <g>
              <path d="M96 150 h52 l-6 44 a8 8 0 0 1 -8 7 h-30 a8 8 0 0 1 -8 -7 Z" fill="#4da3e8"/>
              <path d="M96 158 L66 176 l7 12 L98 176 Z" fill="#3b8bd4"/>
              <circle cx="62" cy="184" r="8" fill="#2f74b5"/>
              <path d="M148 158 q22 6 16 26 q-4 13 -18 12" fill="none" stroke="#3b8bd4" stroke-width="7"/>
              <path d="M104 150 q18 -16 36 0" fill="none" stroke="#3b8bd4" stroke-width="7"/>
            </g>
          </g>

          <!-- flower + pot -->
          <g id="plant">
            <!-- leaves (behind stem top area) -->
            <g id="leafL">
              <path d="M200 428 C150 408 118 420 112 448 C107 474 138 490 168 480 C188 473 200 456 200 428 Z" fill="#3cb54a"/>
              <path d="M196 446 C168 442 142 446 124 454" stroke="#eafbe7" stroke-width="6" fill="none" stroke-linecap="round" opacity=".55"/>
            </g>
            <g id="leafR">
              <path d="M200 428 C250 408 282 420 288 448 C293 474 262 490 232 480 C212 473 200 456 200 428 Z" fill="#43bd50"/>
              <path d="M204 446 C232 442 258 446 276 454" stroke="#eafbe7" stroke-width="6" fill="none" stroke-linecap="round" opacity=".55"/>
            </g>
            <!-- stem (blue, like the drawing) -->
            <path id="stem" d="M200 452 L200 452" stroke="#3f8fdd" stroke-width="13" fill="none" stroke-linecap="round"/>
            <!-- seed -->
            <ellipse id="seed" cx="200" cy="446" rx="11" ry="8" fill="#8a5a2b"/>
            <!-- sprout leaves -->
            <g id="sprout">
              <path d="M200 446 C186 436 176 438 172 446 C176 454 190 454 200 446 Z" fill="#3cb54a"/>
              <path d="M200 446 C214 436 224 438 228 446 C224 454 210 454 200 446 Z" fill="#43bd50"/>
            </g>
            <!-- head -->
            <g id="head" style="cursor:pointer">
              <!-- closed bud -->
              <g id="bud">
                <path d="M200 26 C182 8 184 -18 200 -30 C216 -18 218 8 200 26 Z" fill="#4da3e8"/>
                <path d="M186 22 C192 34 208 34 214 22 C206 28 194 28 186 22 Z" fill="#3cb54a"/>
              </g>
              <!-- open bloom -->
              <g id="bloom">
                <g id="petals" fill="#57a8ec">
                  <ellipse class="petal" cx="200" cy="128" rx="25" ry="42"/>
                  <ellipse class="petal" cx="200" cy="128" rx="25" ry="42"/>
                  <ellipse class="petal" cx="200" cy="128" rx="25" ry="42"/>
                  <ellipse class="petal" cx="200" cy="128" rx="25" ry="42"/>
                  <ellipse class="petal" cx="200" cy="128" rx="25" ry="42"/>
                  <ellipse class="petal" cx="200" cy="128" rx="25" ry="42"/>
                </g>
                <!-- red scribble centre, like the drawing -->
                <g id="scribble" stroke="#d43a2f" stroke-width="4.5" fill="none" stroke-linecap="round">
                  <path d="M182 158 C170 138 196 128 206 146 C216 164 186 176 178 160 C170 145 190 132 204 140"/>
                  <path d="M222 156 C232 140 208 128 196 142 C184 156 210 172 222 162 C232 153 214 138 198 144"/>
                  <path d="M188 178 C182 162 206 154 216 166 C224 176 202 188 192 180 C184 173 196 160 210 164"/>
                  <path d="M176 150 C186 132 214 130 224 146"/>
                  <path d="M214 182 C200 192 182 186 180 172"/>
                </g>
                <circle cx="200" cy="162" r="7" fill="#e8533f" opacity=".55"/>
              </g>
            </g>
          </g>

          <!-- black pot, like the drawing -->
          <g id="pot">
            <path d="M158 448 h84 l-8 52 a10 10 0 0 1 -10 9 h-48 a10 10 0 0 1 -10 -9 Z" fill="#232323"/>
            <rect x="150" y="438" width="100" height="15" rx="7" fill="#333333"/>
            <ellipse cx="200" cy="446" rx="34" ry="5" fill="#4a3520"/>
          </g>

          <!-- butterflies & bee (appear at full bloom) -->
          <g id="visitors" opacity="0">
            <g id="bfly1">
              <ellipse class="wingL" cx="-11" cy="0" rx="11" ry="8" fill="#ff8fb2"/>
              <ellipse class="wingR" cx="11" cy="0" rx="11" ry="8" fill="#ff8fb2"/>
              <ellipse cx="0" cy="1" rx="3.4" ry="8" fill="#5b3a29"/>
            </g>
            <g id="bfly2">
              <ellipse class="wingL" cx="-9" cy="0" rx="9" ry="7" fill="#c39bff"/>
              <ellipse class="wingR" cx="9" cy="0" rx="9" ry="7" fill="#c39bff"/>
              <ellipse cx="0" cy="1" rx="3" ry="7" fill="#5b3a29"/>
            </g>
            <g id="bee">
              <ellipse class="beeWing" cx="-2" cy="-9" rx="6" ry="4" fill="#ffffff" opacity=".85"/>
              <ellipse cx="0" cy="0" rx="11" ry="8" fill="#ffcf3f"/>
              <path d="M-3 -7.6 v15 M4 -7 v14" stroke="#5b3a29" stroke-width="4"/>
              <circle cx="9" cy="-1" r="1.8" fill="#5b3a29"/>
            </g>
          </g>

          <!-- particle layer -->
          <g id="fx"></g>
        </svg>

        <div id="bubble" role="status"></div>

        <div class="corner" id="cornerLeft">
          <button class="pbtn" id="btnOrig" aria-label="看 Rising 的原画">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6" fill="currentColor" stroke="none"/><path d="M4 18 L10 12 L14 16 L17 13 L20 16"/></svg>
            原画
          </button>
        </div>
        <div class="corner" id="cornerRight">
          <button class="pbtn" id="btnSound" aria-label="声音开关">
            <svg id="icoSndOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9 v6 h4 l5 4 V5 L8 9 H4 Z" fill="currentColor" stroke="none"/><path d="M16 9 q3 3 0 6"/><path d="M18.5 6.5 q5 5.5 0 11"/></svg>
            <svg id="icoSndOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M4 9 v6 h4 l5 4 V5 L8 9 H4 Z" fill="currentColor" stroke="none"/><line x1="16" y1="9" x2="22" y2="15"/><line x1="22" y1="9" x2="16" y2="15"/></svg>
          </button>
          <button class="pbtn" id="btnReset" aria-label="重新种一朵">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12 a8 8 0 1 1 -2.3 -5.6"/><path d="M20 3 v4 h-4"/></svg>
          </button>
        </div>

    <script>
    (function(){
      "use strict";
      var SVGNS = "http://www.w3.org/2000/svg";
      function el(id){ return document.getElementById(id); }
      function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
      function lerp(a,b,t){ return a+(b-a)*t; }
      function seg(v,a,b){ return clamp((v-a)/(b-a),0,1); }

      var stem = el("stem"), head = el("head"), bud = el("bud"), bloom = el("bloom"),
          petals = el("petals"), scribble = el("scribble"),
          leafL = el("leafL"), leafR = el("leafR"),
          seed = el("seed"), sprout = el("sprout"),
          plant = el("plant"), canProp = el("canProp"),
          visitors = el("visitors"), bfly1 = el("bfly1"), bfly2 = el("bfly2"), bee = el("bee"),
          fx = el("fx"), bubble = el("bubble"), starsBox = el("stars"),
          sunBody = el("sunBody");

      var petalEls = petals.querySelectorAll(".petal");
      for (var i=0;i<petalEls.length;i++){
        petalEls[i].setAttribute("transform","rotate("+(i*60)+" 200 162)");
      }

      /* stars */
      var starEls = [];
      for (var s=0;s<5;s++){
        var d = document.createElement("div");
        d.className = "star";
        d.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 2.6 L14.7 8.9 L21.4 9.5 L16.3 13.9 L17.9 20.5 L12 16.9 L6.1 20.5 L7.7 13.9 L2.6 9.5 L9.3 8.9 Z"/></svg>';
        starsBox.appendChild(d); starEls.push(d);
      }

      /* ---------- state ---------- */
      var growth = 0, target = 0;
      var bounce = 0, wiggle = 0, sunPulse = 0, canTilt = 0;
      var celebrated = false;
      var milestonesHit = {};
      var particles = [];
      var bubbleTimer = null;

      /* ---------- audio ---------- */
      var actx = null, soundOn = true;
      function ac(){
        if (!soundOn) return null;
        try{
          if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
          if (actx.state === "suspended") actx.resume();
          return actx;
        }catch(e){ return null; }
      }
      function tone(freq, t0, dur, type, vol, slideTo){
        var c = ac(); if(!c) return;
        var o = c.createOscillator(), g = c.createGain();
        o.type = type||"sine";
        o.frequency.setValueAtTime(freq, c.currentTime+t0);
        if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, c.currentTime+t0+dur);
        g.gain.setValueAtTime(0.0001, c.currentTime+t0);
        g.gain.exponentialRampToValueAtTime(vol||0.16, c.currentTime+t0+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime+t0+dur);
        o.connect(g); g.connect(c.destination);
        o.start(c.currentTime+t0); o.stop(c.currentTime+t0+dur+0.05);
      }
      function noiseBurst(t0, dur){
        var c = ac(); if(!c) return;
        var len = Math.floor(c.sampleRate*dur);
        var buf = c.createBuffer(1, len, c.sampleRate);
        var ch = buf.getChannelData(0);
        for (var i=0;i<len;i++) ch[i] = (Math.random()*2-1)*(1-i/len);
        var src = c.createBufferSource(); src.buffer = buf;
        var f = c.createBiquadFilter(); f.type="bandpass"; f.frequency.value = 2600+Math.random()*900; f.Q.value = .7;
        var g = c.createGain(); g.gain.value = .12;
        src.connect(f); f.connect(g); g.connect(c.destination);
        src.start(c.currentTime+t0);
      }
      function sndPop(){ tone(520+Math.random()*160, 0, .14, "sine", .18, 880); }
      function sndRain(){ for (var i=0;i<7;i++) noiseBurst(i*0.11, .09); tone(340,0,.5,"sine",.05,240); }
      function sndSun(){ tone(523,0,.16,"triangle",.14); tone(659,.09,.16,"triangle",.14); tone(784,.18,.24,"triangle",.14); }
      function sndWiggle(){ tone(600,0,.12,"sine",.12,980); tone(880,.08,.12,"sine",.1,620); }
      function sndFanfare(){ var n=[523,659,784,1047,784,1047]; for (var i=0;i<n.length;i++) tone(n[i], i*.11, .22, "triangle", .16); }

      /* ---------- bubble ---------- */
      var phrasesWater = ["咕嘟咕嘟，好喝！","小花在喝水啦","喝饱饱，长高高！"];
      var phrasesSun = ["暖暖的，好舒服！","晒太阳，长高高！","太阳公公抱一抱"];
      var phrasesTap = ["嘿嘿，好痒呀！","小花在跳舞啦","摸一摸，长大啦"];
      function say(text, hold){
        bubble.textContent = text;
        bubble.classList.add("show");
        if (bubbleTimer) clearTimeout(bubbleTimer);
        bubbleTimer = setTimeout(function(){ bubble.classList.remove("show"); }, hold||1700);
      }
      function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

      /* ---------- particles ---------- */
      function spawn(node, kind, x, y, vx, vy, life, grav, extra){
        fx.appendChild(node);
        particles.push({node:node, kind:kind, x:x, y:y, vx:vx, vy:vy, life:life, maxLife:life, grav:grav||0, spin:(Math.random()*2-1)*180, extra:extra||{}});
      }
      function makeDrop(x,y){
        var c = document.createElementNS(SVGNS,"path");
        c.setAttribute("d","M0 -7 C4 -1 5.5 2.5 5.5 5 A5.5 5.5 0 1 1 -5.5 5 C-5.5 2.5 -4 -1 0 -7 Z");
        c.setAttribute("fill","#3f9be0");
        spawn(c,"drop",x,y,(Math.random()*16-8),120+Math.random()*60,1.6,320);
      }
      function makeSpark(x,y,color){
        var p = document.createElementNS(SVGNS,"path");
        p.setAttribute("d","M0 -9 L2.4 -2.4 L9 0 L2.4 2.4 L0 9 L-2.4 2.4 L-9 0 L-2.4 -2.4 Z");
        p.setAttribute("fill",color||"#ffcf3f");
        spawn(p,"spark",x,y,(Math.random()*40-20),-30-Math.random()*36,1.15,-24);
      }
      function makeSplash(x,y){
        var c = document.createElementNS(SVGNS,"ellipse");
        c.setAttribute("cx","0"); c.setAttribute("cy","0");
        c.setAttribute("rx","4"); c.setAttribute("ry","1.8");
        c.setAttribute("fill","none"); c.setAttribute("stroke","#3f9be0"); c.setAttribute("stroke-width","2.4");
        spawn(c,"splash",x,y,0,0,.45,0);
      }
      function makePetalConfetti(x,y){
        var colors = ["#57a8ec","#ff8fb2","#ffd93b","#c39bff","#7ed491"];
        var p = document.createElementNS(SVGNS,"ellipse");
        p.setAttribute("rx","7"); p.setAttribute("ry","4.4");
        p.setAttribute("fill", colors[Math.floor(Math.random()*colors.length)]);
        spawn(p,"confetti",x,y,(Math.random()*130-65),-90-Math.random()*110,2.1,150);
      }

      /* ---------- growth ---------- */
      var MILESTONES = [
        {at:6,  text:"发芽啦！"},
        {at:30, text:"长高啦！"},
        {at:56, text:"有花苞啦！"},
        {at:82, text:"开花啦！好漂亮！"},
        {at:100,text:"蝴蝶蜜蜂都来啦！"}
      ];
      function addGrowth(n){
        var before = target;
        target = clamp(target+n, 0, 100);
        for (var i=0;i<MILESTONES.length;i++){
          var m = MILESTONES[i];
          if (before < m.at && target >= m.at && !milestonesHit[m.at]){
            milestonesHit[m.at] = true;
            setTimeout((function(txt, at){ return function(){
              say(txt, 2100);
              if (at>=82){ sndFanfare(); celebrate(); }
            };})(m.text, m.at), 420);
          }
        }
        updateStars();
      }
      function updateStars(){
        var lit = Math.round(target/20);
        for (var i=0;i<5;i++) starEls[i].classList.toggle("on", i<lit);
      }
      function celebrate(){
        if (celebrated) return;
        celebrated = true;
        var hx = headX(), hy = headY();
        for (var i=0;i<26;i++){
          (function(k){
            setTimeout(function(){ makePetalConfetti(hx+(Math.random()*70-35), hy+(Math.random()*30-15)); }, k*45);
          })(i);
        }
        el("btnAgain").classList.add("show");
      }

      /* head position helpers (match render math) */
      function stemLen(g){ return 8 + seg(g,4,62)*196; }
      function headX(){ return 200 + Math.sin(performance.now()/1400)*3*seg(growth,10,60); }
      function headY(){ return 452 - stemLen(growth) - 34; }

      /* ---------- actions ---------- */
      function doWater(){
        ac(); sndRain();
        canTilt = 1;
        addGrowth(9);
        bounce = Math.min(bounce+0.55, 1);
        say(pick(phrasesWater));
        var hx = 200, top = 452 - stemLen(target);
        var n = 0;
        var iv = setInterval(function(){
          makeDrop(hx + (Math.random()*76-38), top - 120 - Math.random()*26);
          if (++n >= 16){ clearInterval(iv); }
        }, 55);
      }
      function doSun(){
        ac(); sndSun();
        sunPulse = 1;
        addGrowth(9);
        bounce = Math.min(bounce+0.55, 1);
        say(pick(phrasesSun));
        var hx = headX(), hy = headY();
        for (var i=0;i<10;i++){
          (function(k){
            setTimeout(function(){ makeSpark(hx+(Math.random()*110-55), hy+(Math.random()*70-35)); }, k*55);
          })(i);
        }
      }
      function doTapFlower(){
        ac(); sndWiggle();
        wiggle = 1;
        if (target < 100) addGrowth(2);
        say(pick(phrasesTap), 1300);
        var hx = headX(), hy = headY();
        makeSpark(hx-30, hy-16, "#ff8fb2"); makeSpark(hx+32, hy-10, "#57a8ec");
      }
      function reset(){
        target = 0; celebrated = false; milestonesHit = {};
        particles.forEach(function(p){ if(p.node.parentNode) p.node.parentNode.removeChild(p.node); });
        particles = [];
        updateStars();
        el("btnAgain").classList.remove("show");
        say("种下一颗小种子", 1500);
        tone(392,0,.15,"sine",.12); tone(523,.1,.2,"sine",.12);
      }

      /* ---------- render loop ---------- */
      var last = performance.now();
      function frame(now){
        var dt = Math.min((now-last)/1000, .05); last = now;
        growth += (target-growth)*Math.min(1, dt*3.2);
        if (Math.abs(target-growth) < .05) growth = target;
        bounce *= Math.pow(.12, dt); if (bounce<.01) bounce = 0;
        wiggle *= Math.pow(.05, dt); if (wiggle<.01) wiggle = 0;
        sunPulse *= Math.pow(.1, dt); if (sunPulse<.01) sunPulse = 0;
        canTilt *= Math.pow(.18, dt); if (canTilt<.01) canTilt = 0;

        var g = growth;
        var sway = Math.sin(now/1400)*3*seg(g,10,60);
        var wig = Math.sin(now/55)*7*wiggle;
        var L = stemLen(g);
        var topY = 452 - L;
        var bx = 200 + sway + wig;

        /* stem */
        stem.setAttribute("d","M200 452 C "+(200+sway*.3)+" "+(452-L*.45)+", "+(bx-sway*.2)+" "+(452-L*.75)+", "+bx+" "+(topY+26));
        stem.setAttribute("stroke-width", String(6 + seg(g,4,40)*7));

        /* seed & sprout */
        seed.setAttribute("opacity", String(1-seg(g,2,7)));
        var sp = seg(g,3,10)*(1-seg(g,16,26));
        sprout.setAttribute("transform","translate(200 446) scale("+sp+") translate(-200 -446)");
        sprout.setAttribute("opacity", String(clamp(sp*1.6,0,1)));

        /* leaves */
        var lf = seg(g,18,46);
        var leafBounce = 1 + Math.sin(now/300)*0.02 + bounce*.12;
        leafL.setAttribute("transform","translate(200 452) scale("+(lf*leafBounce)+") translate(-200 -452)");
        leafR.setAttribute("transform","translate(200 452) scale("+(lf*leafBounce)+") translate(-200 -452)");
        leafL.setAttribute("opacity", String(clamp(lf*1.5,0,1)));
        leafR.setAttribute("opacity", String(clamp(lf*1.5,0,1)));

        /* head */
        var headScale = .55 + seg(g,50,100)*.6 + bounce*.14;
        head.setAttribute("transform","translate("+bx+" "+(topY-6)+" ) scale("+headScale+") translate(-200 -162)");
        var budT = seg(g,52,66)*(1-seg(g,80,92));
        bud.setAttribute("opacity", String(clamp(budT*1.6,0,1)));
        bud.setAttribute("transform","translate(200 162) scale("+(0.4+seg(g,52,66)*0.6)+") translate(-200 -162)");
        var open = seg(g,80,97);
        bloom.setAttribute("opacity", String(clamp(open*1.8,0,1)));
        var bScale = .3 + open*.7;
        bloom.setAttribute("transform","translate(200 162) scale("+bScale+") translate(-200 -162)");
        for (var i=0;i<petalEls.length;i++){
          var spread = (1-open)*26;
          petalEls[i].setAttribute("transform","rotate("+(i*60 + (i%2? spread : -spread))+" 200 162) scale(1 "+(0.72+open*0.28)+")");
        }
        scribble.setAttribute("transform","translate(200 162) rotate("+(Math.sin(now/900)*2.5)+" ) scale("+(0.6+open*0.4)+") translate(-200 -162)");

        /* sun pulse */
        sunBody.setAttribute("r", String(27 + sunPulse*7 + Math.sin(now/800)*0.8));

        /* watering can prop */
        canProp.setAttribute("opacity", String(clamp(canTilt*1.6,0,1)));
        canProp.setAttribute("transform","translate("+(60-canTilt*26)+" "+(30-canTilt*14)+") rotate("+(-canTilt*24)+" 130 180)");

        /* visitors */
        var vis = seg(g,97,100);
        visitors.setAttribute("opacity", String(vis));
        if (vis > 0){
          var t = now/1000;
          bfly1.setAttribute("transform","translate("+(140+Math.sin(t*.7)*70)+" "+(120+Math.cos(t*1.1)*26)+") rotate("+(Math.sin(t*.9)*14)+")");
          bfly2.setAttribute("transform","translate("+(268+Math.cos(t*.55)*56)+" "+(170+Math.sin(t*.95)*30)+") rotate("+(Math.cos(t*.8)*14)+")");
          bee.setAttribute("transform","translate("+(200+Math.sin(t*1.3)*96)+" "+(96+Math.sin(t*2.2)*16)+")");
        }

        /* particles */
        for (var k=particles.length-1;k>=0;k--){
          var p = particles[k];
          p.life -= dt;
          if (p.life<=0){ if(p.node.parentNode) p.node.parentNode.removeChild(p.node); particles.splice(k,1); continue; }
          p.vy += (p.grav||0)*dt;
          p.x += p.vx*dt; p.y += p.vy*dt;
          var lt = p.life/p.maxLife;
          if (p.kind==="drop" && p.y >= 448 && !p.extra.splashed){
            p.extra.splashed = true; makeSplash(p.x, 449);
            if(p.node.parentNode) p.node.parentNode.removeChild(p.node); particles.splice(k,1); continue;
          }
          var tr = "translate("+p.x+" "+p.y+")";
          if (p.kind==="confetti") tr += " rotate("+(p.spin*(1-lt)*3)+" )";
          if (p.kind==="splash"){
            var rs = 1+(1-lt)*2.6;
            p.node.setAttribute("transform", tr+" scale("+rs+")");
            p.node.setAttribute("opacity", String(lt));
          } else {
            p.node.setAttribute("transform", tr);
            p.node.setAttribute("opacity", String(clamp(lt*1.6,0,1)));
          }
        }
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);

      /* ---------- wiring ---------- */
      el("btnWater").addEventListener("click", doWater);
      el("btnSun").addEventListener("click", doSun);
      el("sunTap").addEventListener("click", doSun);
      head.addEventListener("click", doTapFlower);
      el("btnAgain").addEventListener("click", reset);
      el("btnReset").addEventListener("click", reset);
      el("btnSound").addEventListener("click", function(){
        soundOn = !soundOn;
        el("icoSndOn").style.display = soundOn ? "block" : "none";
        el("icoSndOff").style.display = soundOn ? "none" : "block";
        if (soundOn) sndPop();
      });
      el("btnOrig").addEventListener("click", function(){
        el("origCard").classList.toggle("hidden");
        sndPop();
      });
      /* tap anywhere on the sky: a little sparkle follows the finger */
      el("scene").addEventListener("click", function(ev){
        if (ev.target.closest("#sunTap") || ev.target.closest("#head")) return;
        var pt = el("scene").createSVGPoint();
        pt.x = ev.clientX; pt.y = ev.clientY;
        var loc = pt.matrixTransform(el("scene").getScreenCTM().inverse());
        makeSpark(loc.x, loc.y, "#ffffff");
        makeSpark(loc.x+14, loc.y+10, "#ffcf3f");
        tone(740+Math.random()*200, 0, .1, "sine", .07, 1180);
      });

      updateStars();
      setTimeout(function(){ say("点一点水壶，给小花浇水吧", 2400); }, 600);
    })();
    </script>
  </body>
</html>
