<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:," />
    <title>小花接雨滴</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" />
    <style>
      :root{
        --ink:#2b3a4a;
        --petal:#5aa2f0;
        --center:#e23b2e;
        --stem:#3f7fd0;
        --leaf:#43c04a;
        --pot:#2a2521;
        --sky-top:#9fdcff;
        --sky-bottom:#e9faff;
        --grass:#69cf5a;
        --grass-dark:#4cb944;
        --panel:#ffffff;
        --accent:#ff9f2e;
      }
      *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
      html,body{ height:100%; }
      body{
        margin:0;
        font-family:"ZCOOL KuaiLe","PingFang SC","Yuanti SC","Microsoft YaHei",sans-serif;
        color:var(--ink);
        overflow:hidden;
        background:var(--sky-bottom);
        touch-action:none;
        user-select:none;
        -webkit-user-select:none;
      }
      button{
        font-family:inherit;
        border:none;
        cursor:pointer;
        color:var(--ink);
        min-height:48px;
      }
      .app{ display:flex; flex-direction:column; height:100dvh; }

      /* ---------- top bar ---------- */
      .topbar{
        display:flex; align-items:center; gap:8px;
        padding:8px 10px;
        background:#fffdf5;
        box-shadow:0 2px 10px rgba(60,110,160,.15);
        z-index:30;
      }
      .tabs{ display:flex; gap:8px; flex:1; }
      .tab{
        flex:1;
        font-size:clamp(18px,4.5vw,24px);
        padding:10px 6px;
        border-radius:999px;
        background:#eef4f8;
        color:#7a8b99;
        transition:transform .12s, background .12s, color .12s;
      }
      .tab .emo{ font-size:1.15em; margin-right:2px; }
      .tab.active{ background:var(--accent); color:#fff; box-shadow:0 3px 0 #e07f14; }
      .tab:active{ transform:scale(.96); }
      .iconbtn{
        width:52px; height:52px; flex:0 0 auto;
        border-radius:50%;
        background:#eef4f8;
        font-size:24px;
        display:flex; align-items:center; justify-content:center;
      }
      .iconbtn:active{ transform:scale(.93); }
      .picbtn{
        border-radius:999px;
        background:#eef4f8;
        font-size:17px;
        padding:10px 14px;
        flex:0 0 auto;
      }
      .picbtn:active{ transform:scale(.95); }

      /* ---------- stage ---------- */
      .stage{
        position:relative; flex:1; overflow:hidden;
        background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-bottom) 62%,#fdfdf0 100%);
      }
      .view{ position:absolute; inset:0; display:none; }
      .view.active{ display:block; }
      .sun{
        position:absolute; top:14px; right:16px; width:74px; height:74px;
        border-radius:50%;
        background:radial-gradient(circle at 50% 50%,#ffe98a 0 55%,#ffd93b 56% 100%);
        box-shadow:0 0 34px 10px rgba(255,214,64,.55);
        animation:sunspin 24s linear infinite;
      }
      @keyframes sunspin{ to{ transform:rotate(360deg);} }
      .cloud{
        position:absolute; background:#fff; border-radius:999px; opacity:.95;
        animation:drift linear infinite;
      }
      .cloud::before,.cloud::after{
        content:""; position:absolute; background:#fff; border-radius:50%;
      }
      .cloud.c1{ width:110px; height:34px; top:36px; left:-120px; animation-duration:52s; }
      .cloud.c1::before{ width:52px; height:52px; top:-24px; left:16px; }
      .cloud.c1::after{ width:38px; height:38px; top:-15px; left:56px; }
      .cloud.c2{ width:84px; height:27px; top:104px; left:-90px; animation-duration:74s; animation-delay:-30s; transform:scale(.85); }
      .cloud.c2::before{ width:42px; height:42px; top:-19px; left:12px; }
      .cloud.c2::after{ width:30px; height:30px; top:-12px; left:44px; }
      @keyframes drift{ from{ transform:translateX(0);} to{ transform:translateX(calc(100vw + 260px));} }
      .grass{
        position:absolute; left:0; right:0; bottom:0; height:64px;
        background:linear-gradient(180deg,var(--grass) 0%,var(--grass-dark) 100%);
        border-radius:50% 50% 0 0 / 26px 26px 0 0;
      }
      .grass::before{
        content:"🌼 🌸 🌼 🌸 🌼";
        position:absolute; top:-14px; left:0; right:0;
        text-align:center; font-size:17px; letter-spacing:9vw; opacity:.85;
        white-space:nowrap; overflow:hidden;
      }

      /* ---------- praise bubble ---------- */
      .bubble{
        position:absolute; top:12px; left:50%;
        transform:translate(-50%,-16px) scale(.8);
        background:#fff; color:#e2701d;
        font-size:clamp(20px,5.4vw,30px);
        padding:10px 22px; border-radius:999px;
        box-shadow:0 4px 14px rgba(80,120,160,.25);
        opacity:0; pointer-events:none; z-index:20;
        transition:opacity .18s, transform .18s;
        white-space:nowrap;
      }
      .bubble.show{ opacity:1; transform:translate(-50%,0) scale(1); }

      /* ---------- progress drops ---------- */
      .progress{
        position:absolute; top:12px; left:12px; z-index:15;
        display:flex; gap:4px; flex-wrap:wrap; max-width:46vw;
      }
      .pdrop{
        width:20px; height:26px;
        background:#cfe6f5;
        border-radius:0 50% 50% 50%;
        transform:rotate(45deg);
        transition:background .3s, transform .3s;
      }
      .pdrop.full{ background:linear-gradient(135deg,#7cc4ff,#2f8fe8); transform:rotate(45deg) scale(1.12); }

      /* ---------- catch game ---------- */
      #dropLayer{ position:absolute; inset:0; overflow:hidden; }
      .drop{
        position:absolute; width:24px; height:32px; margin-left:-12px;
        background:linear-gradient(135deg,#8fd0ff 10%,#2f8fe8 90%);
        border-radius:0 50% 50% 50%;
        transform:rotate(45deg);
        box-shadow:inset -3px -3px 6px rgba(255,255,255,.45);
        will-change:top;
      }
      .bug{
        position:absolute; font-size:36px; margin-left:-18px; line-height:1;
        will-change:top; animation:wiggle .3s ease-in-out infinite alternate;
      }
      @keyframes wiggle{ from{ rotate:-9deg;} to{ rotate:9deg;} }
      .splash{
        position:absolute; width:14px; height:14px; margin-left:-7px;
        border:3px solid #57aef0; border-radius:50%;
        animation:splashA .45s ease-out forwards; pointer-events:none;
      }
      @keyframes splashA{ from{ transform:scale(.4); opacity:.9;} to{ transform:scale(2.6); opacity:0;} }
      .spark{
        position:absolute; font-size:22px; pointer-events:none; z-index:12;
        animation:sparkA .8s ease-out forwards;
      }
      @keyframes sparkA{
        from{ transform:translate(0,0) scale(.5); opacity:1;}
        to{ transform:translate(var(--dx),var(--dy)) scale(1.25); opacity:0;}
      }
      .petalfall{
        position:absolute; top:-30px; font-size:24px; pointer-events:none; z-index:11;
        animation:fallA linear forwards;
      }
      @keyframes fallA{
        from{ transform:translate(0,0) rotate(0deg);}
        to{ transform:translate(var(--sway),105vh) rotate(340deg);}
      }
      .flybee,.flybfly{
        position:absolute; font-size:34px; z-index:11; pointer-events:none;
        animation:flyA linear forwards;
      }
      @keyframes flyA{
        0%{ transform:translate(0,0); }
        25%{ transform:translate(26vw,-6vh); }
        50%{ transform:translate(52vw,2vh); }
        75%{ transform:translate(78vw,-5vh); }
        100%{ transform:translate(108vw,0); }
      }

      #potWrap{
        position:absolute; bottom:34px; left:50%;
        width:190px; margin-left:-95px;
        z-index:10; cursor:grab;
        filter:drop-shadow(0 6px 8px rgba(40,80,40,.25));
      }
      #potWrap.shake{ animation:shakeA .55s ease-in-out; }
      #potWrap.bounce{ animation:bounceA .5s ease; }
      @keyframes shakeA{
        0%,100%{ rotate:0deg;} 20%{ rotate:-6deg;} 40%{ rotate:5deg;} 60%{ rotate:-4deg;} 80%{ rotate:3deg;}
      }
      @keyframes bounceA{
        0%{ transform:translateY(0);} 35%{ transform:translateY(-14px);} 70%{ transform:translateY(2px);} 100%{ transform:translateY(0);}
      }
      .hint{
        position:absolute; bottom:8px; left:0; right:0; text-align:center;
        font-size:15px; color:#4d7a52; z-index:9; pointer-events:none;
      }
      #againBtn{
        position:absolute; left:50%; bottom:118px; transform:translateX(-50%) scale(0);
        z-index:22; font-size:24px; padding:14px 34px; border-radius:999px;
        background:#ff5d8f; color:#fff; box-shadow:0 5px 0 #d63d6e;
        transition:transform .3s cubic-bezier(.34,1.56,.64,1);
      }
      #againBtn.show{ transform:translateX(-50%) scale(1); }
      #againBtn:active{ transform:translateX(-50%) scale(.94); }

      /* flower growth transitions */
      .grow{ transition:transform .7s cubic-bezier(.34,1.4,.64,1), opacity .5s; }

      /* ---------- color game ---------- */
      #colorFlower{
        position:absolute; left:50%; top:44%;
        transform:translate(-50%,-50%);
        width:min(74vw,380px); z-index:10;
        filter:drop-shadow(0 8px 10px rgba(40,80,40,.22));
      }
      #colorFlower .tappable{ cursor:pointer; }
      #colorFlower .pop{ animation:partPop .35s ease; transform-box:fill-box; transform-origin:center; }
      @keyframes partPop{ 0%{ transform:scale(1);} 40%{ transform:scale(1.13);} 100%{ transform:scale(1);} }
      #stampLayer{ position:absolute; inset:0; z-index:12; pointer-events:none; }
      .stamp{
        position:absolute; transform:translate(-50%,-50%);
        pointer-events:none; line-height:1;
        animation:stampIn .3s cubic-bezier(.34,1.56,.64,1);
      }
      @keyframes stampIn{ from{ scale:2.1; opacity:0;} to{ scale:1; opacity:1;} }
      .toolbar{
        position:absolute; left:0; right:0; bottom:0; z-index:25;
        background:rgba(255,253,245,.96);
        box-shadow:0 -2px 12px rgba(60,110,160,.16);
        padding:8px 10px calc(10px + env(safe-area-inset-bottom));
      }
      .toolrow{ display:flex; gap:8px; justify-content:center; margin-bottom:8px; }
      .toolbtn{
        flex:1; max-width:210px; font-size:19px; padding:9px 4px; border-radius:999px;
        background:#eef4f8; color:#7a8b99;
      }
      .toolbtn.active{ background:#43b581; color:#fff; box-shadow:0 3px 0 #2f8a62; }
      .toolbtn:active{ transform:scale(.96); }
      .swatches{ display:flex; gap:9px; justify-content:center; flex-wrap:wrap; }
      .swatch{
        width:52px; height:52px; min-height:52px; border-radius:50%;
        border:4px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,.22);
        padding:0;
      }
      .swatch.sel{ border-color:#ffb020; transform:scale(1.14); }
      .swatch:active{ transform:scale(.94); }
      .stamps{ display:none; gap:9px; justify-content:center; flex-wrap:wrap; }
      .stamps.show{ display:flex; }
      .stampbtn{
        width:56px; height:56px; min-height:56px; border-radius:18px;
        background:#eef4f8; font-size:32px; padding:0;
        display:flex; align-items:center; justify-content:center;
      }
      .stampbtn.sel{ background:#ffe1ec; box-shadow:0 0 0 3px #ff5d8f inset; }
      .stampbtn:active{ transform:scale(.93); }
      .clearrow{ display:flex; justify-content:center; margin-top:8px; }
      .clearbtn{
        font-size:16px; padding:8px 22px; border-radius:999px; background:#f3e6d8; color:#9a6b3f;
      }
      .clearbtn:active{ transform:scale(.95); }

      /* ---------- original photo modal ---------- */
      .modal{
        position:fixed; inset:0; z-index:50; display:none;
        background:rgba(20,35,50,.72);
        align-items:center; justify-content:center; padding:18px;
      }
      .modal.open{ display:flex; }
      .modalcard{
        background:#fff; border-radius:20px; padding:12px; max-width:560px; width:100%;
        text-align:center;
      }
      .modalcard img{ width:100%; border-radius:12px; display:block; }
      .modalcard p{ margin:10px 0 4px; font-size:19px; color:#555; }
      .modalcard button{
        margin-top:8px; font-size:19px; padding:10px 34px; border-radius:999px;
        background:var(--accent); color:#fff;
      }

      @media (prefers-reduced-motion: reduce){
        .cloud,.sun{ animation:none; }
        .petalfall,.flybee,.flybfly{ display:none; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="topbar">
        <div class="tabs">
          <button class="tab active" id="tabCatch"><span class="emo">🌧️</span>接雨滴</button>
          <button class="tab" id="tabColor"><span class="emo">🎨</span>涂色花</button>
        </div>
        <button class="picbtn" id="picBtn">🖼️ 原画</button>
        <button class="iconbtn" id="soundBtn" aria-label="声音开关">🔊</button>
      </div>

      <div class="stage" id="stage">
        <div class="sun"></div>
        <div class="cloud c1"></div>
        <div class="cloud c2"></div>

        <!-- ======== 游戏2：小花接雨滴 ======== -->
        <section class="view active" id="viewCatch">
          <div class="progress" id="progress"></div>
          <div class="bubble" id="bubbleCatch"></div>
          <div id="dropLayer"></div>
          <div class="grass"></div>
          <div id="potWrap"></div>
          <button id="againBtn">🌱 再种一朵</button>
          <div class="hint">👆 拖着花盆，接住雨滴！</div>
        </section>

        <!-- ======== 游戏3：花花变身涂色 ======== -->
        <section class="view" id="viewColor">
          <div class="bubble" id="bubbleColor"></div>
          <div id="stampLayer"></div>
          <div class="grass"></div>
          <div id="colorFlower"></div>
          <div class="toolbar">
            <div class="toolrow">
              <button class="toolbtn active" id="toolPaint">🖌️ 涂颜色</button>
              <button class="toolbtn" id="toolStamp">🦋 盖印章</button>
            </div>
            <div class="swatches" id="swatches"></div>
            <div class="stamps" id="stamps"></div>
            <div class="clearrow">
              <button class="clearbtn" id="resetColor">↩️ 变回原来的花</button>
            </div>
          </div>
        </section>
      </div>
    </div>

    <!-- 原画 -->

    <script>
      "use strict";
      /* ================= 声音（程序合成） ================= */
      let audioCtx = null, muted = false;
      function ac(){
        if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
        if(audioCtx && audioCtx.state === "suspended") audioCtx.resume();
        return audioCtx;
      }
      function tone(freq, t0, dur, type, vol, slideTo){
        const c = ac(); if(!c || muted) return;
        const o = c.createOscillator(), g = c.createGain();
        const t = c.currentTime + t0;
        o.type = type || "sine";
        o.frequency.setValueAtTime(freq, t);
        if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol || 0.16, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination);
        o.start(t); o.stop(t + dur + 0.05);
      }
      const sfx = {
        plip(){ tone(520, 0, .14, "sine", .18, 940); },
        grow(){ tone(660, 0, .12, "triangle", .16); tone(880, .1, .16, "triangle", .16); },
        bloom(){
          [523,659,784,1047].forEach((f,i)=>tone(f, i*.11, .22, "triangle", .17));
          tone(1319, .48, .3, "sine", .12);
        },
        boing(){ tone(320, 0, .34, "square", .07, 90); tone(210, .05, .3, "sine", .14, 70); },
        splash(){ tone(300, 0, .1, "sine", .05, 140); },
        pop(i){ tone(420 + (i||0)*55, 0, .1, "triangle", .16, 760 + (i||0)*60); },
        stamp(){ tone(500, 0, .09, "sine", .15, 300); tone(900, .07, .12, "sine", .1); }
      };
      document.getElementById("soundBtn").addEventListener("click", function(){
        muted = !muted;
        this.textContent = muted ? "🔇" : "🔊";
        if(!muted) sfx.pop(2);
      });

      /* ================= 小花 SVG（照原画：蓝瓣红心蓝茎绿叶黑盆） ================= */
      // stage: 0种子 1发芽 2小茎 3长叶 4高茎 5花苞 6大花苞 7开花
      function flowerSVG(stage, prefix){
        const stemH = [0, 14, 44, 62, 92, 104, 110, 110][stage];
        const stemTop = 218 - stemH;
        const showSprout = stage >= 1;
        const showLeaf1 = stage >= 3, showLeaf2 = stage >= 4;
        const showBud = stage === 5 || stage === 6;
        const budScale = stage === 6 ? 1.35 : 1;
        const showBloom = stage >= 7;
        let petals = "";
        for(let i = 0; i < 7; i++){
          const a = (360 / 7) * i - 90;
          petals += '<ellipse class="petalshape" cx="0" cy="-34" rx="17" ry="27" fill="var(--petal)" transform="rotate(' + a + ')"/>';
        }
        let scribble = "";
        const loops = [
          "M-13,-7 C-20,-18 6,-20 10,-9 C14,2 -8,12 -13,3 C-17,-4 -2,-13 6,-7",
          "M-9,9 C-17,0 -4,-14 7,-11 C16,-8 12,7 2,9 C-5,11 -12,4 -7,-2",
          "M-15,2 C-8,-11 13,-9 12,1 C11,10 -9,13 -13,6",
          "M-4,-14 C5,-15 12,-5 7,4 C3,11 -10,9 -10,0 C-10,-7 0,-9 3,-4"
        ];
        loops.forEach(function(d){ scribble += '<path d="' + d + '" fill="none" stroke="var(--center)" stroke-width="3.4" stroke-linecap="round"/>'; });
        return '' +
        '<svg viewBox="0 0 200 268" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="小花">' +
          // 茎
          (stemH > 0 ? '<g class="tappable" data-part="stem"><rect class="grow" x="95" y="' + stemTop + '" width="10" height="' + stemH + '" rx="5" fill="var(--stem)"/></g>' : '') +
          // 叶子
          (showLeaf1 ? '<g class="tappable grow" data-part="leaf"><path d="M96,196 C60,178 34,190 30,208 C46,224 82,220 96,206 Z" fill="var(--leaf)"/></g>' : '') +
          (showLeaf2 ? '<g class="tappable grow" data-part="leaf"><path d="M104,178 C138,158 166,168 171,188 C156,206 118,202 104,190 Z" fill="var(--leaf)"/></g>' : '') +
          // 发芽
          (showSprout && stage < 3 ? '<g class="tappable grow" data-part="leaf"><path d="M100,218 C92,204 80,200 72,204 C78,216 92,220 100,218 Z" fill="var(--leaf)"/><path d="M100,218 C108,203 121,199 129,203 C123,216 108,220 100,218 Z" fill="var(--leaf)"/></g>' : '') +
          // 花苞
          (showBud ? '<g class="tappable grow" data-part="petal" transform="translate(100,' + stemTop + ') scale(' + budScale + ')"><path d="M0,6 C-17,-4 -15,-30 0,-40 C15,-30 17,-4 0,6 Z" fill="var(--petal)"/><path d="M0,8 C-5,0 -12,-2 -16,2 C-8,9 6,10 0,8 Z" fill="var(--leaf)"/></g>' : '') +
          // 开花：蓝花瓣 + 红色涂鸦花心
          (showBloom ? '<g class="tappable" data-part="petal" transform="translate(100,' + stemTop + ')"><g class="bloomspin">' + petals + '</g><circle cx="0" cy="0" r="15" fill="var(--petal)" opacity="0.35"/><g class="tappable" data-part="center">' + scribble + '</g></g>' : '') +
          // 种子
          (stage === 0 ? '<ellipse cx="100" cy="216" rx="13" ry="6" fill="#8a5a33"/>' : '') +
          // 黑花盆
          '<g class="tappable" data-part="pot"><rect x="58" y="212" width="84" height="13" rx="6" fill="var(--pot)"/><path d="M64,225 L136,225 L129,262 L71,262 Z" fill="var(--pot)"/></g>' +
        '</svg>';
      }

      /* ================= 夸奖气泡 ================= */
      function makeBubble(el){
        let timer = null;
        return function(text, hold){
          el.textContent = text;
          el.classList.add("show");
          clearTimeout(timer);
          timer = setTimeout(function(){ el.classList.remove("show"); }, hold || 1300);
        };
      }

      /* ================= 视图切换 ================= */
      const tabCatch = document.getElementById("tabCatch");
      const tabColor = document.getElementById("tabColor");
      const viewCatch = document.getElementById("viewCatch");
      const viewColor = document.getElementById("viewColor");
      function switchView(which){
        const isCatch = which === "catch";
        tabCatch.classList.toggle("active", isCatch);
        tabColor.classList.toggle("active", !isCatch);
        viewCatch.classList.toggle("active", isCatch);
        viewColor.classList.toggle("active", !isCatch);
        if(isCatch) startCatch(); else stopCatch();
        sfx.pop(isCatch ? 1 : 3);
      }
      tabCatch.addEventListener("click", function(){ switchView("catch"); });
      tabColor.addEventListener("click", function(){ switchView("color"); });

      /* ================= 原画弹窗 ================= */
      const picModal = document.getElementById("picModal");
      document.getElementById("picBtn").addEventListener("click", function(){ picModal.classList.add("open"); });
      document.getElementById("picClose").addEventListener("click", function(){ picModal.classList.remove("open"); });
      picModal.addEventListener("click", function(e){ if(e.target === picModal) picModal.classList.remove("open"); });

      /* ================= 游戏2：小花接雨滴 ================= */
      const stageEl = document.getElementById("stage");
      const dropLayer = document.getElementById("dropLayer");
      const potWrap = document.getElementById("potWrap");
      const progressEl = document.getElementById("progress");
      const againBtn = document.getElementById("againBtn");
      const bubbleCatch = makeBubble(document.getElementById("bubbleCatch"));

      const TOTAL = 10;
      const STAGE_AT = [0, 1, 2, 3, 4, 5, 5, 6, 6, 6, 7]; // 接到第 n 滴时的阶段
      let caught = 0, bloomed = false;
      let potX = 0.5;           // 0~1 相对位置
      let drops = [];           // {el, x(0~1), y(px), speed, isBug, counted}
      let rafId = null, lastTs = 0, spawnTimer = 0, running = false, celebrated = false;

      for(let i = 0; i < TOTAL; i++){
        const d = document.createElement("div");
        d.className = "pdrop";
        progressEl.appendChild(d);
      }
      function renderFlower(){ potWrap.innerHTML = flowerSVG(STAGE_AT[caught], "c"); }
      function renderProgress(){
        const dots = progressEl.children;
        for(let i = 0; i < TOTAL; i++) dots[i].classList.toggle("full", i < caught);
      }
      function layoutPot(){
        const w = stageEl.clientWidth;
        potWrap.style.left = (potX * w) + "px";
      }
      function resetCatch(){
        caught = 0; bloomed = false; celebrated = false;
        drops.forEach(function(d){ d.el.remove(); });
        drops = [];
        againBtn.classList.remove("show");
        renderFlower(); renderProgress();
      }
      function spawnDrop(){
        const isBug = !bloomed && Math.random() < 0.16;
        const el = document.createElement("div");
        el.className = isBug ? "bug" : "drop";
        if(isBug) el.textContent = "🐛";
        const d = {
          el: el,
          x: 0.06 + Math.random() * 0.88,
          y: -40,
          speed: 120 + Math.random() * 70,
          isBug: isBug,
          counted: false
        };
        el.style.left = (d.x * stageEl.clientWidth) + "px";
        el.style.top = d.y + "px";
        dropLayer.appendChild(el);
        drops.push(d);
      }
      function sparkle(cx, cy, chars){
        for(let i = 0; i < 5; i++){
          const s = document.createElement("div");
          s.className = "spark";
          s.textContent = chars[i % chars.length];
          s.style.left = cx + "px"; s.style.top = cy + "px";
          s.style.setProperty("--dx", (Math.random() * 110 - 55) + "px");
          s.style.setProperty("--dy", (-30 - Math.random() * 60) + "px");
          dropLayer.appendChild(s);
          setTimeout(function(){ s.remove(); }, 850);
        }
      }
      function celebrate(){
        celebrated = true;
        sfx.bloom();
        bubbleCatch("🎉 开花啦！你真棒！", 2400);
        againBtn.classList.add("show");
        // 花瓣雨
        const chars = ["🌸","💙","🌼","💧"];
        for(let i = 0; i < 16; i++){
          const p = document.createElement("div");
          p.className = "petalfall";
          p.textContent = chars[i % chars.length];
          p.style.left = (Math.random() * 96) + "vw";
          p.style.setProperty("--sway", (Math.random() * 90 - 45) + "px");
          p.style.animationDuration = (2.4 + Math.random() * 2) + "s";
          p.style.animationDelay = (Math.random() * 0.9) + "s";
          dropLayer.appendChild(p);
          setTimeout(function(){ p.remove(); }, 5600);
        }
        // 蝴蝶和蜜蜂飞过
        [["🦋", 60], ["🐝", 130], ["🦋", 190]].forEach(function(pair, i){
          const f = document.createElement("div");
          f.className = i === 1 ? "flybee" : "flybfly";
          f.textContent = pair[0];
          f.style.top = pair[1] + "px";
          f.style.left = "-50px";
          f.style.animationDuration = (5 + i * 1.3) + "s";
          f.style.animationDelay = (0.4 + i * 0.8) + "s";
          dropLayer.appendChild(f);
          setTimeout(function(){ f.remove(); }, 10000);
        });
      }
      function onCatch(d, cx, catchY){
        if(d.isBug){
          sfx.boing();
          bubbleCatch("哎呀，小虫子！🐛", 1100);
          potWrap.classList.remove("shake"); void potWrap.offsetWidth;
          potWrap.classList.add("shake");
          d.el.style.transition = "transform .5s ease-out, opacity .5s";
          d.el.style.transform = "translate(70px,-90px) rotate(160deg)";
          d.el.style.opacity = "0";
          setTimeout(function(){ d.el.remove(); }, 520);
          return;
        }
        sfx.plip();
        caught = Math.min(caught + 1, TOTAL);
        renderProgress();
        sparkle(cx, catchY, ["💧","✨","💙"]);
        if(caught >= TOTAL && !bloomed){
          bloomed = true;
          renderFlower();
          potWrap.classList.remove("bounce"); void potWrap.offsetWidth;
          potWrap.classList.add("bounce");
          celebrate();
        } else if(!bloomed){
          const before = STAGE_AT[caught - 1], after = STAGE_AT[caught];
          renderFlower();
          if(after > before){
            sfx.grow();
            bubbleCatch(["发芽啦！🌱","长高啦！","长叶子啦！🍃","再长高高！","有花苞啦！","花苞变大啦！"][after - 1] || "长大啦！", 1200);
            potWrap.classList.remove("bounce"); void potWrap.offsetWidth;
            potWrap.classList.add("bounce");
          } else {
            bubbleCatch("接住啦！💧", 800);
          }
        } else {
          bubbleCatch("小花喝饱啦！💧", 800);
          potWrap.classList.remove("bounce"); void potWrap.offsetWidth;
          potWrap.classList.add("bounce");
        }
        d.el.remove();
      }
      function loop(ts){
        if(!running) return;
        const dt = Math.min((ts - lastTs) / 1000 || 0, 0.05);
        lastTs = ts;
        spawnTimer -= dt;
        if(spawnTimer <= 0){ spawnDrop(); spawnTimer = 0.85 + Math.random() * 0.55; }
        const W = stageEl.clientWidth, H = stageEl.clientHeight;
        const potCenterX = potX * W;
        const groundY = H - 56;
        // 接住高度：花盆口往上一点（花长高后接到花头附近）
        const flowerTopY = H - 34 - (268 * (190 / 200)) * ([0.16,0.3,0.42,0.55,0.72,0.82,0.88,0.95][STAGE_AT[caught]]);
        const catchY = Math.max(flowerTopY, 90);
        for(let i = drops.length - 1; i >= 0; i--){
          const d = drops[i];
          d.y += d.speed * dt;
          d.el.style.top = d.y + "px";
          const dx = Math.abs(d.x * W - potCenterX);
          if(!d.counted && d.y >= catchY){
            d.counted = true;
            if(dx <= 92){ onCatch(d, d.x * W, catchY); drops.splice(i, 1); continue; }
          }
          if(d.y >= groundY){
            if(!d.isBug){
              const sp = document.createElement("div");
              sp.className = "splash";
              sp.style.left = (d.x * W) + "px"; sp.style.top = groundY + "px";
              dropLayer.appendChild(sp);
              setTimeout(function(){ sp.remove(); }, 480);
              sfx.splash();
            }
            d.el.remove();
            drops.splice(i, 1);
          }
        }
        rafId = requestAnimationFrame(loop);
      }
      function startCatch(){
        if(running) return;
        running = true; lastTs = 0; spawnTimer = 0.3;
        rafId = requestAnimationFrame(loop);
      }
      function stopCatch(){
        running = false;
        if(rafId) cancelAnimationFrame(rafId);
      }
      // 拖动 / 点按移动花盆
      let dragging = false;
      function pointToPot(e){
        const r = stageEl.getBoundingClientRect();
        potX = Math.min(0.92, Math.max(0.08, (e.clientX - r.left) / r.width));
        layoutPot();
      }
      viewCatch.addEventListener("pointerdown", function(e){
        if(e.target === againBtn) return;
        ac(); dragging = true; pointToPot(e);
      });
      viewCatch.addEventListener("pointermove", function(e){ if(dragging) pointToPot(e); });
      window.addEventListener("pointerup", function(){ dragging = false; });
      viewCatch.addEventListener("pointerdown", function(){
        potWrap.classList.remove("bounce");
      });
      againBtn.addEventListener("click", function(){ resetCatch(); bubbleCatch("种下新种子啦！🌱", 1200); sfx.grow(); });
      window.addEventListener("resize", layoutPot);
      renderFlower(); renderProgress(); layoutPot();
      startCatch();

      /* ================= 游戏3：花花变身涂色 ================= */
      const colorFlower = document.getElementById("colorFlower");
      const stampLayer = document.getElementById("stampLayer");
      const swatchesEl = document.getElementById("swatches");
      const stampsEl = document.getElementById("stamps");
      const bubbleColor = makeBubble(document.getElementById("bubbleColor"));
      const toolPaint = document.getElementById("toolPaint");
      const toolStamp = document.getElementById("toolStamp");

      const COLORS = [
        { c: "#5aa2f0", n: "蓝色" }, { c: "#ff5d8f", n: "粉色" }, { c: "#e23b2e", n: "红色" },
        { c: "#ffb020", n: "黄色" }, { c: "#9b6dd6", n: "紫色" }, { c: "#43c04a", n: "绿色" },
        { c: "#ff8a3d", n: "橙色" }, { c: "#ffffff", n: "白色" }
      ];
      const STAMPS = ["🦋", "🐝", "⭐", "❤️", "🌸", "🐞", "🌈", "🍓"];
      const DEFAULTS = { petal: "#5aa2f0", center: "#e23b2e", stem: "#3f7fd0", leaf: "#43c04a", pot: "#2a2521" };
      let tool = "paint";
      let curColor = COLORS[0], curColorIdx = 0;
      let curStamp = STAMPS[0];
      let paintState = Object.assign({}, DEFAULTS);

      function renderColorFlower(){
        colorFlower.innerHTML = flowerSVG(7, "p");
        applyPaint();
      }
      function applyPaint(){
        colorFlower.style.setProperty("--petal", paintState.petal);
        colorFlower.style.setProperty("--center", paintState.center);
        colorFlower.style.setProperty("--stem", paintState.stem);
        colorFlower.style.setProperty("--leaf", paintState.leaf);
        colorFlower.style.setProperty("--pot", paintState.pot);
      }
      // 色板
      COLORS.forEach(function(item, i){
        const b = document.createElement("button");
        b.className = "swatch" + (i === 0 ? " sel" : "");
        b.style.background = item.c;
        b.setAttribute("aria-label", item.n);
        b.addEventListener("click", function(){
          curColor = item; curColorIdx = i;
          swatchesEl.querySelectorAll(".swatch").forEach(function(s){ s.classList.remove("sel"); });
          b.classList.add("sel");
          sfx.pop(i);
        });
        swatchesEl.appendChild(b);
      });
      // 印章
      STAMPS.forEach(function(s, i){
        const b = document.createElement("button");
        b.className = "stampbtn" + (i === 0 ? " sel" : "");
        b.textContent = s;
        b.addEventListener("click", function(){
          curStamp = s;
          stampsEl.querySelectorAll(".stampbtn").forEach(function(x){ x.classList.remove("sel"); });
          b.classList.add("sel");
          sfx.stamp();
        });
        stampsEl.appendChild(b);
      });
      function setTool(t){
        tool = t;
        toolPaint.classList.toggle("active", t === "paint");
        toolStamp.classList.toggle("active", t === "stamp");
        swatchesEl.style.display = t === "paint" ? "flex" : "none";
        stampsEl.classList.toggle("show", t === "stamp");
        sfx.pop(t === "paint" ? 2 : 4);
      }
      toolPaint.addEventListener("click", function(){ setTool("paint"); });
      toolStamp.addEventListener("click", function(){ setTool("stamp"); });

      // 点花的不同部位上色
      colorFlower.addEventListener("pointerdown", function(e){
        if(tool !== "paint") return;
        const g = e.target.closest("[data-part]");
        if(!g) return;
        const part = g.getAttribute("data-part");
        paintState[part] = curColor.c;
        applyPaint();
        sfx.pop(curColorIdx);
        const shapes = g.querySelectorAll("ellipse,path,rect,circle");
        const el = shapes.length ? shapes[0] : g;
        el.classList.remove("pop"); void el.getBoundingClientRect();
        el.classList.add("pop");
        const names = { petal: "花瓣", center: "花心", stem: "花茎", leaf: "叶子", pot: "花盆" };
        bubbleColor(names[part] + "变成" + curColor.n + "啦！", 900);
        e.stopPropagation();
      });
      // 盖印章：点场景任意位置
      viewColor.addEventListener("pointerdown", function(e){
        if(tool !== "stamp") return;
        if(e.target.closest(".toolbar") || e.target.closest(".topbar")) return;
        ac();
        const r = stageEl.getBoundingClientRect();
        const x = e.clientX - r.left, y = e.clientY - r.top;
        if(y > r.height - 150) return; // 别盖到工具栏上
        const s = document.createElement("div");
        s.className = "stamp";
        s.textContent = curStamp;
        s.style.left = x + "px"; s.style.top = y + "px";
        s.style.fontSize = (34 + Math.random() * 22) + "px";
        s.style.rotate = (Math.random() * 30 - 15) + "deg";
        stampLayer.appendChild(s);
        while(stampLayer.children.length > 40) stampLayer.firstChild.remove();
        sfx.stamp();
      });
      document.getElementById("resetColor").addEventListener("click", function(){
        paintState = Object.assign({}, DEFAULTS);
        applyPaint();
        stampLayer.innerHTML = "";
        bubbleColor("变回 Rising 的小花啦！🌼", 1200);
        sfx.grow();
      });
      renderColorFlower();
    </script>
  </body>
</html>
